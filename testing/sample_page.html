<!doctype html><html><head><meta charset="utf-8"><title>{{HEADLINE}}</title>
<style>
  @page { size: letter portrait; margin: 0.5in; }
  * { box-sizing: border-box; }
  body { font-family: "Helvetica Neue", Arial, sans-serif; color:#000; margin:0; padding:0.5in; }
  .headline { font-size: 30pt; font-weight:900; letter-spacing:1px; text-align:center; margin:0 0 6pt; }
  .score-row { display:flex; align-items:center; justify-content:center; gap:14px; border-top:3px solid #000; border-bottom:3px solid #000; padding:14px 0; margin:10px 0; }
  .score { font-size:40pt; font-weight:900; min-width:60px; text-align:center; }
  .dash { font-size:30pt; font-weight:700; }
  .team { display:flex; align-items:center; min-width:170px; }
  .abbr { font-size:18pt; font-weight:800; }
  .context { text-align:center; font-size:11pt; font-weight:700; letter-spacing:1px; margin:8px 0; }
  .desc { font-size:12pt; line-height:1.5; margin:14px 0; border-left:4px solid #000; padding-left:12px; }
  .footer { margin-top:14px; font-size:8pt; color:#555; text-align:center; border-top:1px solid #ccc; padding-top:6px; }
</style></head><body>
  <div class="headline">{{HEADLINE}}</div>
  <div class="score-row">
    <div class="team"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/scoreboard/jax.png" style="width:34px;height:34px;object-fit:contain;margin-right:8px" /><div class="abbr">{{AWAY}}</div></div>
    <div class="score">{{SA}}</div><div class="dash">–</div><div class="score">{{SH}}</div>
    <div class="team"><div class="abbr">{{HOME}}</div></div>
  </div>
  <div class="context">3RD QUARTER • 8:42 • 1st &amp; 10</div>
  <div class="desc">{{DESC}}</div>
  <div class="footer">Mock server job {{JOBID}}</div>
</body></html>
